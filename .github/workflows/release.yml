name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  images:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend: ${{ steps.backend.outputs.digest }}
      web: ${{ steps.web.outputs.digest }}
      updater: ${{ steps.updater.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: backend
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/jcardonne/tullips-backend:${{ github.ref_name }}
          build-args: RELEASE_VERSION=${{ github.ref_name }}
      - uses: docker/build-push-action@v6
        id: web
        with:
          context: web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/jcardonne/tullips-web:${{ github.ref_name }}
          build-args: RELEASE_VERSION=${{ github.ref_name }}
      - uses: docker/build-push-action@v6
        id: updater
        with:
          context: updater
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/jcardonne/tullips-updater:${{ github.ref_name }}
  publish:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Package release
        env:
          BACKEND_DIGEST: ${{ needs.images.outputs.backend }}
          WEB_DIGEST: ${{ needs.images.outputs.web }}
          UPDATER_DIGEST: ${{ needs.images.outputs.updater }}
        run: python3 scripts/release.py --version "${GITHUB_REF_NAME#v}" --repository "$GITHUB_REPOSITORY" --backend "$BACKEND_DIGEST" --web "$WEB_DIGEST" --updater "$UPDATER_DIGEST"
      - uses: actions/attest-build-provenance@v3
        id: attest
        with:
          subject-path: .release/release.json
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" .release/release.sigstore.json
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --draft .release/release.json .release/release.sigstore.json .release/source.tar.gz
          gh release edit "$GITHUB_REF_NAME" --draft=false
